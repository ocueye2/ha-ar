server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=()" always;
  location = /health { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|mind)$ { expires 7d; add_header Cache-Control "public, immutable"; }
}
