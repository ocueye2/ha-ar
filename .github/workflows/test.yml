# Run the Node test suite (tests/*.test.ts, node:test) on every push to main
# and every pull request. The tests only cover the pure helpers in src/lib
# (ids, colour, detection hold, image resize math, storage, sign-in errors),
# so no Home Assistant, browser, or camera is needed to run them.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: the dependency tree includes node-canvas, whose
      # native build needs system libraries this job does not install.
      # Nothing under test needs it; the Docker workflow builds the image.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
