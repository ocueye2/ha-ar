services:
  homeassistant-ar:
    build: .
    image: homeassistant-ar:latest
    container_name: homeassistant-ar
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
